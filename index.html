<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AL QALAM Literature Festival</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Lexend:wght@400;600;800&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF2EE;--card:#fff;--ink:#12302B;--mute:#4B655E;--line:#C6D4CC;--bad:#A3322B;--sinai:#B4632B;--judi:#1F7A5A;--safa:#2F6DB0;--hero:#0F3B36;--hi:#F1E8D0;--gold:#E2BC62;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0B1B20;--card:#12292F;--ink:#EDE6D2;--mute:#9DB3AC;--line:#24424A;--bad:#F08A80;--sinai:#E08A4F;--judi:#4FBF93;--safa:#6FA8E6}}
:root[data-theme=dark]{--bg:#0B1B20;--card:#12292F;--ink:#EDE6D2;--mute:#9DB3AC;--line:#24424A;--bad:#F08A80;--sinai:#E08A4F;--judi:#4FBF93;--safa:#6FA8E6}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 Figtree,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hero)}
a{color:inherit}:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--hero);color:var(--hi);display:flex;align-items:center;gap:16px;padding:10px 16px}
.brand{font-family:Amiri,serif;font-size:1.25rem;font-weight:700;text-decoration:none;white-space:nowrap;color:var(--gold)}
nav{display:flex;gap:16px;overflow-x:auto;white-space:nowrap}nav a{text-decoration:none;padding:4px 0;border-bottom:2px solid transparent}nav a.on{border-color:var(--gold)}
.hero{background:var(--hero) url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='72' height='72'><g fill='none' stroke='%23E2BC62' stroke-opacity='.16'><rect x='16' y='16' width='40' height='40'/><rect x='16' y='16' width='40' height='40' transform='rotate(45 36 36)'/></g></svg>");color:var(--hi);text-align:center;padding:44px 20px 56px}
.bis{font-family:Amiri,serif;font-size:1.5rem;color:var(--gold)}
.ayah{font-family:Amiri,'Noto Naskh Arabic',serif;font-size:clamp(2.1rem,9vw,3.8rem);line-height:1.9;margin:.2em 0 0}
.pen{width:min(320px,70%);height:14px;display:block;margin:0 auto}
.pen path{stroke-dasharray:1;stroke-dashoffset:1;animation:d 1.8s .3s ease forwards}@keyframes d{to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){.pen path{animation:none;stroke-dashoffset:0}}
.tr{font-style:italic;opacity:.9;margin:.6em auto;max-width:34ch}
h1{font-family:Amiri,serif;font-size:clamp(2.8rem,13vw,5.4rem);letter-spacing:.1em;margin:.1em 0;line-height:1.1}
.moto{font-family:Amiri,serif;font-size:1.5rem;color:var(--gold);margin:0}.org{max-width:34ch;margin:.8em auto}
.wrap{max-width:760px;margin:0 auto;padding:28px 16px 36px}.narrow{max-width:420px}
h2,h3{font-family:Amiri,serif;margin:1.1em 0 .4em}h2{font-size:1.9rem;margin-top:0}
.grid{display:grid;gap:12px}@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0}.grid .card{margin:0}
.mute{color:var(--mute)}.bad{color:var(--bad)}small{font-size:.85em}
.btn{display:inline-block;background:var(--gold);color:#1A1405;font:700 1rem Figtree,sans-serif;border:2px solid var(--gold);border-radius:999px;padding:9px 20px;text-decoration:none;cursor:pointer;margin:4px 2px}
.btn.o{background:transparent;color:inherit;border-color:currentColor}.btn.s{padding:3px 12px;font-size:.9rem;margin-top:8px}
.pill{display:inline-block;border-radius:999px;padding:2px 12px;font-size:.9rem;font-weight:700;border:1px solid currentColor}.ok{color:#8FE0B5}.no{color:#FFB3A8}
.wrap .ok{color:var(--judi)}.wrap .no{color:var(--bad)}.hero .ok{color:#8FE0B5}
.tag{margin-inline-start:8px;font-size:.85rem;border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--mute)}
.row{flex-wrap:wrap;display:flex;gap:12px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line)}.row>span{flex:1}.tm{min-width:54px}
.bar{display:grid;grid-template-columns:104px 1fr 44px;gap:8px;align-items:center;margin:8px 0}.bar i{height:14px;border-radius:7px;display:block}.bar b{text-align:end}
label{display:block;margin:10px 0 2px;font-weight:500}
input,select{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
footer{text-align:center;padding:24px 16px;background:var(--hero);color:var(--hi)}footer b{color:var(--gold)}
.logo{width:96px;height:96px;border-radius:18px;background:#fff;padding:3px;display:block;margin:0 auto 12px}.sm{width:auto;min-width:0}.col3{grid-template-columns:repeat(3,1fr)}

[hidden]{display:none!important}
:root,:root:not([data-theme=light]),:root[data-theme=dark]{--bg:#F3EBDD;--card:#FFFBF3;--ink:#2B1408;--mute:#6E5645;--line:#DCCDB6;--hero:#3A1B0C;--hi:#F3EBDD;--gold:#D49A55;--bad:#A3322B;--sinai:#B4632B;--judi:#1F7A5A;--safa:#2F6DB0}
h1,h2,h3,.brand,.moto{font-family:Lexend,sans-serif}
.btn{background:#8B3A12;border-color:#8B3A12;color:#FFF6E6}.btn.o{background:transparent;color:inherit;border-color:currentColor}
.poster{background:linear-gradient(#EEE6D8,#F2E7D0 65%,#F7E8B9);text-align:center;padding:22px 16px 0;overflow:hidden;color:#2B1408}
.poster .lg{height:46px;mix-blend-mode:multiply}
.art{font:500 1.35rem/1.2 Lexend,sans-serif;color:#4A4A48;text-align:start;max-width:520px;margin:14px auto 0}
.emb{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin:8px 0}
.emblem{height:210px;animation:fl 4.5s ease-in-out infinite;filter:drop-shadow(0 8px 10px #5a2a0e55)}
@keyframes fl{50%{transform:translateY(-10px) rotate(-2deg) scale(1.04)}}
.poster h1{font:800 clamp(3rem,15vw,5.6rem)/1 Lexend,sans-serif;color:#7A2F0E;letter-spacing:0;margin:0}
.qalam{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:center;color:#8B3A12;font-weight:500;margin:8px 0}
.orgs{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;font-size:.8rem;letter-spacing:.03em;margin:16px 0}
.desk{display:block;width:calc(100% + 32px);margin:0 -16px;-webkit-mask-image:linear-gradient(transparent,#000 30%);mask-image:linear-gradient(transparent,#000 30%)}
.note{margin:12px 0}.note.h{font:700 1.6rem Lexend,sans-serif}.note.q{font:italic 1.25rem Amiri,serif;border-inline-start:4px solid var(--gold);padding-inline-start:12px}
.note.a{font:1.9rem/1.9 Amiri,serif;direction:rtl;text-align:center}.note.b{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.greet{margin:12px 0;padding:14px 16px;border-radius:12px;color:#fff;background:var(--c);font:600 1.15rem Lexend,sans-serif;animation:pop .9s cubic-bezier(.2,1.4,.4,1) both,glow 2.4s 1s ease-in-out infinite}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.95)}}@keyframes glow{50%{box-shadow:0 0 18px var(--c)}}
@media(prefers-reduced-motion:reduce){.emblem,.greet{animation:none}}

const ty=p=>p.type=='G'?'Group':'Individual',srt=()=>[...S.programs].sort((a,b)=>(a.day+a.time).localeCompare(b.day+b.time));

const when=()=>esc(S.info.dates)+(S.info.venue?', '+esc(S.info.venue):''),meta=p=>(p.st=='S'?'Stage':'Off stage')+', '+ty(p)+', '+PZ[p.zone],gp=g=>(S.gr.find(x=>x.g==g)||{p:0}).p;

K.forEach(k=>t[k]+=+(S.adj||{})[k]||0);return{t,ind:Object.entries(ind).map(([k,v])=>{const a=k.split('|');return{n:a[0],tm:a[1],z:a[2],v}}).sort((a,b)=>b.v-a.v)}}

schedule(){const d={};srt().forEach(p=>(d[p.day]=d[p.day]||[]).push(p));E('app').innerHTML=`<section class="wrap"><h2>Schedule</h2><p class="mute">${when()}</p>${Object.keys(d).map(k=>`<h3>${esc(k)}</h3>${d[k].map(p=>`<div class="row"><b class="tm">${esc(p.time)}</b><span>${esc(p.name)}<small class="mute"> ${meta(p)}, ${esc(p.venue)}</small></span></div>`).join('')}`).join('')||'<p class="mute">The schedule will appear once programs are added.</p>'}</section>`},

${S.showInd?'<h3>Individual leaders</h3>':''}${(S.showInd?p.ind:[]).slice(0,10).map((x,i)=>`<div class="row"><b class="tm">${i+1}</b><span>${esc(x.n)}<small class="mute"> ${T[x.tm].n}, ${ZN[x.z]}</small></span><b>${x.v}</b></div>`).join('')||(S.showInd?'<p class="mute">Leaders appear here once points are added.</p>':'')}

async function doLogin(){msg('Signing in…');const{error}=await SB.auth.signInWithPassword({email:g('u'),password:E('pw').value});if(error)return msg('Email or password is not correct.');await prof();if(!me){await SB.auth.signOut();return msg('This account has no role yet. Ask the coordinator.')}await load();go('dash');route()}

async function addReg(){if(!S.open)return;const p=S.programs.find(x=>x.id==+E('rp').value);let n=g('rn');if(p.type=='G'){const a=E('rg').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!a.length)return msg('Enter the group members.');if(p.gs&&a.length!=p.gs)return msg('This group needs exactly '+p.gs+' students.');n=a.join(', ')}if(!n)return msg('Enter the student’s name.');if(await run(SB.from('regs').insert({program_id:p.id,team:me.t,name:n,student_class:g('rc'),zone:E('rz').value})))team()}

<h3>Festival details</h3><div class="two"><label>Dates<input id="fd" value="${esc(S.info.dates)}"></label><label>Venue<input id="fv" value="${esc(S.info.venue)}"></label></div><button class="btn" onclick="saveInfo()">Save details</button>
<h3>Home page notes</h3><div class="two"><label>Note<input id="nt"></label><label>Style<select id="ns"><option value="n">Normal</option><option value="h">Heading</option><option value="q">Quote</option><option value="a">Arabic</option><option value="b">Highlight box</option></select></label></div><button class="btn" onclick="addNote()">Add note</button>${(S.notes||[]).map((n,i)=>`<div class="row"><span>${esc(n.t)}</span><button class="btn s o" onclick="delNote(${i})">Remove</button></div>`).join('')}
<h3>Team points</h3><p class="mute">Points are added automatically when you press Add points on a program. You can also adjust them by hand (a minus sign deducts).</p><div class="two col3">${K.map(k=>`<label>${T[k].n}<input id="adj${k}" type="number" value="${(S.adj||{})[k]||0}"></label>`).join('')}</div><button class="btn" onclick="saveAdj()">Save manual points</button> <button class="btn o" onclick="setS({showInd:!S.showInd})">${S.showInd?'Hide':'Show'} individual leaders</button>
<h3>Add or edit a program</h3><input id="pe" type="hidden"><label>Program name<input id="pn"></label>
<div class="two"><label>Category<input id="pc" placeholder="Arabic, Arts, Quiz"></label><label>Stage or off stage<select id="ps"><option value="S">Stage</option><option value="O">Off stage</option></select></label>
<label>Individual or group<select id="pt"><option value="I">Individual</option><option value="G">Group</option></select></label><label>Zone<select id="pz">${o(Object.entries(PZ))}</select></label>
<label>Day<input id="pd" value="Day 1"></label><label>Time<input id="ptm" type="time" value="09:00"></label>
<label>Venue<input id="pv"></label><label>Max entries per team<input id="pm" type="number" min="1" value="2"></label><label>Group size (group programs)<input id="pgs" type="number" min="0" value="0"></label></div>
<p id="m" class="bad"></p><button id="pb" class="btn" onclick="addP()">Add program</button>
<h3>Programs and entries</h3>${srt().map(p=>`<div class="card"><b>${esc(p.name)}</b> ${S.results[p.id]?'<span class="pill ok">Results published</span>':''}<div class="mute">${meta(p)}. ${esc(p.day)}, ${esc(p.time)}, ${esc(p.venue)}. Entries: ${K.map(k=>T[k].n+' '+S.regs.filter(r=>r.pid==p.id&&r.t==k).length).join(', ')}</div><button class="btn s" onclick="edP(${p.id})">Edit</button> <button class="btn s o" onclick="delP(${p.id})">Remove</button>${S.results[p.id]?`<button class="btn s" onclick="addPts(${p.id},${!p.pa})">${p.pa?'Remove points':'Add points'}</button>`:''}${ent(p)}</div>`).join('')||'<p class="mute">No programs yet. Add the first one above.</p>'}
<h3>Points, grades and limits</h3><p class="mute">Place points for individual programs (1st, 2nd, 3rd)</p><div class="two col3">${[0,1,2].map(i=>`<input id="ip${i+1}" type="number" value="${S.pts.I[i]}">`).join('')}</div>
<p class="mute">Place points for group programs</p><div class="two col3">${[0,1,2].map(i=>`<input id="gp${i+1}" type="number" value="${S.pts.G[i]}">`).join('')}</div>
<p class="mute">Grades: name and points. A+ is listed first: enter its points, then save. (Leave a name empty to remove that grade.)</p><div class="two">${[0,1,2,3,4,5].map(i=>{const G=(S.gr.some(x=>x.g=='A+')?S.gr:[{g:'A+',p:''},...S.gr])[i]||{};return`<input id="gn${i}" placeholder="Grade name, e.g. A+" value="${esc(G.g||'')}"><input id="gv${i}" type="number" placeholder="Points" value="${G.p??''}">`}).join('')}</div>
<div class="two"><label>Off-stage individual limit per student<input id="lo" type="number" min="1" value="${S.lim.O}"></label><label>Stage individual limit per student<input id="ls" type="number" min="1" value="${S.lim.S}"></label></div>
<button class="btn" onclick="saveRules()">Save points and limits</button>
<h3>Publish results</h3><label>Program<select id="rs" onchange="resUI()">${srt().map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label><div id="slots"></div>
<p id="m2" class="bad"></p><button class="btn" onclick="pub()">Publish results</button> <button class="btn o" onclick="unpub()">Unpublish</button>
<p><button class="btn o" onclick="logout()">Log out</button> </p></section>`;resUI()}
function saveInfo(){setS({info:{dates:g('fd'),venue:g('fv')}})}
function saveRules(){const n=i=>+E(i).value||0;setS({pts:{I:[1,2,3].map(i=>n('ip'+i)),G:[1,2,3].map(i=>n('gp'+i))},gr:[0,1,2,3,4,5].map(i=>({g:g('gn'+i),p:n('gv'+i)})).filter(x=>x.g),lim:{O:Math.max(1,n('lo')),S:Math.max(1,n('ls'))}})}
function edP(id){const p=S.programs.find(x=>x.id==id);[['pn','name'],['pc','cat'],['pt','type'],['ps','st'],['pz','zone'],['pd','day'],['ptm','time'],['pv','venue'],['pm','max'],['pgs','gs']].forEach(a=>E(a[0]).value=p[a[1]]);E('pe').value=id;E('pb').textContent='Save changes';E('pn').scrollIntoView({block:'center'});E('pn').focus()}
function resUI(){const s=E('rs');if(!s)return;const id=+s.value,rs=S.regs.filter(r=>r.pid==id&&r.at),cur=S.results[id]||[];
E('slots').innerHTML=rs.length?rs.map(r=>{const c=cur.find(x=>x.n==r.n&&x.t==r.t)||{};return`<div class="row"><span>${esc(r.n)}<small class="mute"> ${T[r.t].n}, ${ZN[r.z]}${r.cd?', code '+esc(r.cd):''}</small></span><select class="sm" id="pl${r.id}" aria-label="Place"><option value="0">No place</option>${[1,2,3].map(i=>`<option value="${i}"${c.pl==i?' selected':''}>Place ${i}</option>`).join('')}</select><select class="sm" id="gr${r.id}" aria-label="Grade"><option value="">No grade</option>${S.gr.map(x=>`<option value="${esc(x.g)}"${c.g==x.g?' selected':''}>Grade ${esc(x.g)}</option>`).join('')}</select></div>`}).join(''):'<p class="mute">No team has registered for this program yet.</p>'}
async function pub(){const id=+E('rs').value,out=[];S.regs.filter(r=>r.pid==id&&r.at).forEach(r=>{const pl=+E('pl'+r.id).value,gr=E('gr'+r.id).value;if(pl||gr)out.push({program_id:id,team:r.t,name:r.n,zone:r.z,place:pl,grade:gr||null})});
if(!out.length)return msg('Choose a place or grade for at least one entry.','m2');const d=await SB.from('results').delete().eq('program_id',id);if(d.error)return msg(d.error.message,'m2');
if(await run(SB.from('results').insert(out),'m2')){coord();E('rs').value=id;resUI()}}
async function unpub(){const id=+E('rs').value;if(id){await SB.from('programs').update({pts_added:false}).eq('id',id);if(await run(SB.from('results').delete().eq('program_id',id)))coord()}}
function tog(){setS({open:!S.open})}
async function addP(){if(!g('pn'))return msg('Enter a program name.');const o={name:g('pn'),category:g('pc')||'General',type:g('pt'),stage:g('ps'),zone:g('pz'),day:g('pd')||'Day 1',at_time:g('ptm')||'09:00',venue:g('pv')||'To be announced',max_per_team:+g('pm')||1,group_size:+g('pgs')||0},id=+g('pe');
if(await run(id?SB.from('programs').update(o).eq('id',id):SB.from('programs').insert(o)))coord()}
async function delP(id){if(await run(SB.from('programs').delete().eq('id',id)))coord()}
const ent=p=>{const a=S.regs.filter(r=>r.pid==p.id);return a.length?`<details><summary>Entry list (${a.length})</summary>${a.map(r=>`<div class="row"><span>${esc(r.n)}<small class="mute"> ${T[r.t].n}${r.cd?', code '+esc(r.cd):''}</small></span><button class="btn s${r.at?'':' o'}" onclick="att(${r.id},${!r.at})">${r.at?'Participated':'Absent'}</button></div>`).join('')}<button class="btn s o" onclick="codeP(${p.id})">Assign code letters</button></details>`:''};
async function att(id,v){if(await run(SB.from('regs').update({attended:v}).eq('id',id)))coord()}
async function addPts(id,v){if(await run(SB.from('programs').update({pts_added:v}).eq('id',id)))coord()}
async function codeP(id){const a=S.regs.filter(r=>r.pid==id&&r.at).sort(()=>Math.random()-.5),L=n=>(n>25?L(Math.floor(n/26)-1):'')+String.fromCharCode(65+n%26),rs=await Promise.all(a.map((r,i)=>SB.from('regs').update({code:L(i)}).eq('id',r.id))),e=rs.find(x=>x.error);if(e)return alert(e.error.message);await load();coord()}
function addNote(){if(g('nt'))setS({notes:[...(S.notes||[]),{t:g('nt'),s:E('ns').value}]})}
function delNote(i){setS({notes:S.notes.filter((_,j)=>j!=i)})}
function saveAdj(){setS({adj:Object.fromEntries(K.map(k=>[k,+E('adj'+k).value||0]))})}
function grpUI(){if(!E('rp'))return;const p=S.programs.find(x=>x.id==+E('rp').value),G=!!p&&p.type=='G';E('rnl').hidden=G;E('rgl').hidden=!G;if(G&&p.gs)E('rg').placeholder=p.gs+' students, one per line'}
function stu(t){const m={};S.regs.filter(r=>r.t==t).forEach(r=>(m[r.n]=m[r.n]||[]).push(r));return Object.keys(m).sort().map(n=>{const tot=m[n].reduce((a,r)=>{const p=S.programs.find(x=>x.id==r.pid),x=p&&p.pa&&(S.results[p.id]||[]).find(y=>y.n==n&&y.t==t);return a+(x?(x.pl?S.pts[p.type][x.pl-1]:0)+(x.g?gp(x.g):0):0)},0);return`<div class="card"><b>${esc(n)}</b> <span class="tag">${tot} marks</span>${m[n].map(r=>{const p=S.programs.find(x=>x.id==r.pid);return p?`<div class="row"><b class="tm">${esc(p.time)}</b><span>${esc(p.name)}<small class="mute"> ${esc(p.day)}, ${esc(p.venue)}${r.at?'':', absent'}</small></span></div>`:''}).join('')}</div>`}).join('')||'<p class="mute">No students yet.</p>'}
function remind(){if(!('Notification' in window))return msg('This browser does not support notifications.','rm');Notification.requestPermission().then(pm=>{if(pm!='granted')return msg('Please allow notifications for this site.','rm');RM.forEach(clearTimeout);RM=[];S.regs.filter(r=>r.t==me.t&&r.at).forEach(r=>{const p=S.programs.find(x=>x.id==r.pid);if(!p)return;const d=new Date(FD+'T'+(p.time||'09:00').slice(0,5)+':00');d.setDate(d.getDate()+(parseInt(String(p.day).replace(/\D/g,''))||1)-1);const w=d-Date.now()-3e5;if(w>0)RM.push(setTimeout(()=>new Notification('Starting in 5 minutes',{body:r.n+': '+p.name+' at '+p.venue}),w))});msg(RM.length+' reminders set. Keep this page open.','rm')})}
function route(){let r=location.hash.slice(1)||'home';if(r=='dash'&&!me)r='login';(V[r]||V.home)();
E('nav').innerHTML=[['home','Home'],['programs','Programs'],['schedule','Schedule'],['points','Points'],[me?'dash':'login',me?'Dashboard':'Login']].map(a=>`<a href="#${a[0]}"${a[0]==r?' class="on"':''}>${a[1]}</a>`).join('');scrollTo(0,0);if(ERR)E('app').insertAdjacentHTML('afterbegin','<div class="wrap bad">Could not load data: '+esc(ERR)+'</div>')}
addEventListener('hashchange',()=>load().then(route));
(async()=>{if(!SB){E('app').innerHTML='<p class="wrap bad">Could not load the page. Check your internet connection and refresh.</p>';return}
const{data}=await SB.auth.getSession();if(data.session)await prof();await load();route()})();
</script></body></html>
