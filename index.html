<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AL QALAM Literature Festival</title>
<meta name="theme-color" content="#2E1A0E">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4EDDC;--card:#FBF7EC;--ink:#3A2415;--mute:#6F5642;--line:#D9C8A6;--cu:#9A4A1D;--bad:#A3322B;--ok:#1F7A5A;--sinai:#B4632B;--judi:#1F7A5A;--safa:#2F6DB0;--dk:#2E1A0E;--cr:#F3E8D2;--gold:#E3B866;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1B120C;--card:#2B1D13;--ink:#F2E6CF;--mute:#BFA98A;--line:#4A3524;--cu:#E39A5E;--bad:#F08A80;--ok:#4FBF93;--sinai:#E08A4F;--judi:#4FBF93;--safa:#6FA8E6}}
:root[data-theme=dark]{--bg:#1B120C;--card:#2B1D13;--ink:#F2E6CF;--mute:#BFA98A;--line:#4A3524;--cu:#E39A5E;--bad:#F08A80;--ok:#4FBF93;--sinai:#E08A4F;--judi:#4FBF93;--safa:#6FA8E6}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Montserrat,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--dk)}
a{color:inherit}:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--dk);color:var(--cr);display:flex;align-items:center;gap:16px;padding:10px 16px}
.brand{font-weight:700;font-size:.9rem;letter-spacing:.14em;text-decoration:none;white-space:nowrap;color:var(--gold)}.brand span{font-family:Amiri,serif;font-size:1.35rem;letter-spacing:0;margin-inline-end:6px}
nav{display:flex;gap:16px;overflow-x:auto;white-space:nowrap;font-size:.86rem;font-weight:500}nav a{text-decoration:none;padding:4px 0;border-bottom:2px solid transparent}nav a.on{border-color:var(--gold)}
.hero{position:relative;overflow:hidden;text-align:center;color:#3A2415;padding:28px 18px 210px;background:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .4 0 0 0 0 .28 0 0 0 0 .16 0 0 0 .09 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"),linear-gradient(180deg,#EDE1D0 0%,#F3EAD9 55%,#F6E6B8 100%)}
.hero>*{position:relative;z-index:1}.hero>.lamp{position:absolute;z-index:0;right:0;bottom:0;width:min(60%,290px);height:auto;pointer-events:none}
.t1{font-weight:500;font-size:1.1rem;letter-spacing:.03em;color:#5B4636;margin:0}
.sig{height:150px;width:auto;display:block;margin:8px auto 0}
.wm{font-weight:800;font-size:clamp(3rem,15vw,5.6rem);line-height:1.05;letter-spacing:-.01em;margin:.05em 0 .15em;background:linear-gradient(180deg,#A9511F,#5B2A12);-webkit-background-clip:text;background-clip:text;color:transparent}
.acr{font-size:.9rem;color:#6B4A33;margin:.2em 0}.acr b{color:#9A4A1D;font-weight:800}
.dt{font-weight:700;font-size:1.2rem;margin:1.1em 0 0}.vn{font-size:.9rem;color:#5B4636;margin:.2em 0}
.hero .btn.o{color:#7A3A17;border-color:#7A3A17}.hero .ok{color:#1F6B4D}.hero .no{color:#A3322B}
.band{text-align:center;padding:34px 16px 6px}.ayah{font-family:Amiri,'Noto Naskh Arabic',serif;font-size:clamp(2rem,9vw,3.2rem);line-height:1.9;margin:0}
.pen{width:min(300px,70%);height:14px;display:block;margin:0 auto;color:var(--cu)}
.pen path{stroke-dasharray:1;stroke-dashoffset:1;animation:d 1.8s .3s ease forwards}@keyframes d{to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){.pen path{animation:none;stroke-dashoffset:0}}
.tr{font-style:italic;color:var(--mute);margin:.6em auto;max-width:34ch;font-size:.95rem}
.wrap{max-width:760px;margin:0 auto;padding:28px 16px 36px}.narrow{max-width:420px}

.grid{display:grid;gap:12px}@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:10px 0}.grid .card{margin:0}
.mute{color:var(--mute)}.bad{color:var(--bad)}small{font-size:.85em}
.btn{display:inline-block;background:linear-gradient(180deg,#A9511F,#6E3115);color:#FFF3DF;font:700 .95rem Montserrat,sans-serif;border:2px solid #8A4018;border-radius:999px;padding:9px 20px;text-decoration:none;cursor:pointer;margin:4px 2px}
.btn.o{background:transparent;color:var(--cu);border-color:var(--cu)}.btn.s{padding:3px 12px;font-size:.85rem;margin-top:8px}
.pill{display:inline-block;border-radius:999px;padding:2px 12px;font-size:.85rem;font-weight:700;border:1px solid currentColor}.ok{color:var(--ok)}.no{color:var(--bad)}
.tag{margin-inline-start:8px;font-size:.8rem;border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--mute)}

label{display:block;margin:10px 0 2px;font-weight:500;font-size:.92rem}
input,select{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.col3{grid-template-columns:repeat(3,1fr)}.sm{width:auto;min-width:0}

.chk{display:flex;gap:10px;align-items:flex-start;margin:8px 0;font-weight:400}.chk input{width:auto;margin-top:5px}

<p><a class="btn o" href="#points">Full standings</a> <a class="btn o" href="#schedule">Schedule</a></p></section>`},
programs(){E('app').innerHTML=`<section class="wrap"><h2>Programs</h2><p class="mute">${when()}</p>${pill()}${srt().map(p=>`<div class="card"><b>${esc(p.name)}</b><div class="mute">${meta(p)}. ${esc(p.cat)}. ${esc(p.day)}, ${esc(p.time)}, ${esc(p.venue)}. Up to ${p.max} per team.</div></div>`).join('')||'<p class="mute">The coordinator has not published programs yet.</p>'}</section>`},
schedule(){const d={};srt().forEach(p=>(d[p.day]=d[p.day]||[]).push(p));E('app').innerHTML=`<section class="wrap"><h2>Schedule</h2><p class="mute">${when()}</p>${Object.keys(d).map(k=>`<h3>${esc(k)}</h3>${d[k].map(p=>`<div class="row"><b class="tm">${esc(p.time)}</b><span>${esc(p.name)}<small class="mute"> ${meta(p)}, ${esc(p.venue)}</small></span></div>`).join('')}`).join('')||'<p class="mute">The schedule will appear once programs are added.</p>'}</section>`},
points(){const p=pts(),mx=Math.max(1,...K.map(k=>p.t[k])),ids=Object.keys(S.results);E('app').innerHTML=`<section class="wrap"><h2>Points</h2><p class="mute">${ids.length} of ${S.programs.length} programs published. Place points: individual ${S.pts.I.join(', ')}; group ${S.pts.G.join(', ')}. Grade points: ${S.gr.map(x=>esc(x.g)+' '+x.p).join(', ')}.</p>

<h3>Results by program</h3>${ids.map(id=>{const pr=S.programs.find(x=>x.id==id);return pr?`<div class="card"><b>${esc(pr.name)}</b>${S.results[id].map(r=>`<div>${r.pl?r.pl+'.':'-'} ${esc(r.n)} <small class="mute">${T[r.t].n}${r.g?', grade '+esc(r.g):''}</small></div>`).join('')}</div>`:''}).join('')||'<p class="mute">No results yet.</p>'}</section>`},
login(){E('app').innerHTML=`<section class="wrap narrow"><h2>Log in</h2><p class="mute">For the coordinator and team leaders.</p><label>Email<input id="u" type="email" autocomplete="username" autocapitalize="none"></label><label>Password<input id="pw" type="password" autocomplete="current-password"></label><p id="m" class="bad"></p><button class="btn" onclick="doLogin()">Log in</button></section>`;E('pw').onkeydown=e=>e.key=='Enter'&&doLogin()},
dash(){me.r=='C'?coord():team()}};
async function doLogin(){msg('Signing in…');const{error}=await SB.auth.signInWithPassword({email:g('u'),password:E('pw').value});if(error)return msg('Email or password is not correct.');await prof();if(!me){await SB.auth.signOut();return msg('This account has no role yet. Ask the coordinator.')}await load();go('dash');route()}

<p><button class="btn o" onclick="logout()">Log out</button></p></section>`;if(S.open)plist()}

const one=st=>srt().filter(p=>p.type=='I'&&p.st==st&&okZ(z,p.zone)).map(p=>{const full=mine.filter(r=>r.pid==p.id).length>=p.max,had=have.has(p.id);return`<label class="chk"><input type="checkbox" class="pc" value="${p.id}" data-st="${p.st}"${had?' checked disabled':full?' disabled':keep.includes(String(p.id))?' checked':''}><span>${esc(p.name)}<small class="mute"> ${esc(p.day)} ${esc(p.time)}${had?', already registered':full?', team full':''}</small></span></label>`}).join('')||'<p class="mute">No programs for this zone yet.</p>';
E('pls').innerHTML=`<h3>Stage programs</h3>${one('S')}<h3>Off-stage programs</h3>${one('O')}`;E('pls').onchange=cnt;cnt()}

E('cn').textContent='Stage '+c('S')+' of '+S.lim.S+', off stage '+c('O')+' of '+S.lim.O;E('cn').className=c('S')>S.lim.S||c('O')>S.lim.O?'bad':'mute'}
async function addStu(){if(!S.open)return;const n=g('rn'),z=E('rz').value,ids=[...document.querySelectorAll('.pc:checked:not(:disabled)')].map(x=>+x.value);if(!n)return msg('Enter the student’s name.');if(!ids.length)return msg('Tick at least one program.');

await load();team();msg((ok?'Registered '+ok+' program'+(ok>1?'s':'')+'. ':'')+bad.join(' | '),'m',bad.length?'bad':'ok')}
async function addGrp(){if(!S.open)return;const n=g('qn');if(!n)return msg('Enter the group name.','m2');if(await run(SB.from('regs').insert({program_id:+E('qp').value,team:me.t,name:n,student_class:'',zone:E('qz').value}),'m2'))team()}

function more(id){const r=S.regs.find(x=>x.id==id);E('rn').value=r.n;E('rc').value=r.c;E('rz').value=r.z;plist();E('rn').scrollIntoView({block:'center'})}
function coord(){const o=(a,v)=>a.map(x=>`<option value="${x[0]}"${x[0]==v?' selected':''}>${x[1]}</option>`).join('');E('app').innerHTML=`<section class="wrap"><h2>Coordinator dashboard</h2>
<div class="card">${pill()} <button class="btn s" onclick="tog()">${S.open?'Stop registration':'Start registration'}</button></div>

<h3>Add or edit a program</h3><input id="pe" type="hidden"><label>Program name<input id="pn"></label>
<div class="two"><label>Category<input id="pc" placeholder="Arabic, Arts, Quiz"></label><label>Stage or off stage<select id="ps"><option value="S">Stage</option><option value="O">Off stage</option></select></label>

<label>Day<input id="pd" value="Day 1"></label><label>Time<input id="ptm" type="time" value="09:00"></label>
<label>Venue<input id="pv"></label><label>Max entries per team<input id="pm" type="number" min="1" value="2"></label></div>
<p id="m" class="bad"></p><button id="pb" class="btn" onclick="addP()">Add program</button>
<h3>Programs and entries</h3>${srt().map(p=>`<div class="card"><b>${esc(p.name)}</b> ${S.results[p.id]?'<span class="pill ok">Results published</span>':''}<div class="mute">${meta(p)}. ${esc(p.day)}, ${esc(p.time)}, ${esc(p.venue)}. Entries: ${K.map(k=>T[k].n+' '+S.regs.filter(r=>r.pid==p.id&&r.t==k).length).join(', ')}</div><button class="btn s" onclick="edP(${p.id})">Edit</button> <button class="btn s o" onclick="delP(${p.id})">Remove</button></div>`).join('')||'<p class="mute">No programs yet. Add the first one above.</p>'}
<h3>Points, grades and limits</h3><p class="mute">Place points for individual programs (1st, 2nd, 3rd)</p><div class="two col3">${[0,1,2].map(i=>`<input id="ip${i+1}" type="number" value="${S.pts.I[i]}">`).join('')}</div>
<p class="mute">Place points for group programs</p><div class="two col3">${[0,1,2].map(i=>`<input id="gp${i+1}" type="number" value="${S.pts.G[i]}">`).join('')}</div>
<p class="mute">Grades: name and points (leave the name empty to remove a grade)</p><div class="two">${[0,1,2,3,4,5].map(i=>`<input id="gn${i}" placeholder="Grade name" value="${esc((S.gr[i]||{}).g||'')}"><input id="gv${i}" type="number" placeholder="Points" value="${(S.gr[i]||{}).p??''}">`).join('')}</div>
<div class="two"><label>Off-stage individual limit per student<input id="lo" type="number" min="1" value="${S.lim.O}"></label><label>Stage individual limit per student<input id="ls" type="number" min="1" value="${S.lim.S}"></label></div>
<button class="btn" onclick="saveRules()">Save points and limits</button>
<h3>Publish results</h3><label>Program<select id="rs" onchange="resUI()">${srt().map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label><div id="slots"></div>
<p id="m2" class="bad"></p><button class="btn" onclick="pub()">Publish results</button> <button class="btn o" onclick="unpub()">Unpublish</button>
<p><button class="btn o" onclick="logout()">Log out</button> </p></section>`;resUI()}
function saveInfo(){setS({info:{dates:g('fd'),venue:g('fv')}})}
function saveRules(){const n=i=>+E(i).value||0;setS({pts:{I:[1,2,3].map(i=>n('ip'+i)),G:[1,2,3].map(i=>n('gp'+i))},gr:[0,1,2,3,4,5].map(i=>({g:g('gn'+i),p:n('gv'+i)})).filter(x=>x.g),lim:{O:Math.max(1,n('lo')),S:Math.max(1,n('ls'))}})}
function edP(id){const p=S.programs.find(x=>x.id==id);[['pn','name'],['pc','cat'],['pt','type'],['ps','st'],['pz','zone'],['pd','day'],['ptm','time'],['pv','venue'],['pm','max']].forEach(a=>E(a[0]).value=p[a[1]]);E('pe').value=id;E('pb').textContent='Save changes';E('pn').scrollIntoView({block:'center'});E('pn').focus()}

E('slots').innerHTML=rs.length?rs.map(r=>{const c=cur.find(x=>x.n==r.n&&x.t==r.t)||{};return`<div class="row"><span>${esc(r.n)}<small class="mute"> ${T[r.t].n}, ${ZN[r.z]}</small></span><select class="sm" id="pl${r.id}" aria-label="Place"><option value="0">No place</option>${[1,2,3].map(i=>`<option value="${i}"${c.pl==i?' selected':''}>Place ${i}</option>`).join('')}</select><select class="sm" id="gr${r.id}" aria-label="Grade"><option value="">No grade</option>${S.gr.map(x=>`<option value="${esc(x.g)}"${c.g==x.g?' selected':''}>Grade ${esc(x.g)}</option>`).join('')}</select></div>`}).join(''):'<p class="mute">No team has registered for this program yet.</p>'}
async function pub(){const id=+E('rs').value,out=[];S.regs.filter(r=>r.pid==id).forEach(r=>{const pl=+E('pl'+r.id).value,gr=E('gr'+r.id).value;if(pl||gr)out.push({program_id:id,team:r.t,name:r.n,zone:r.z,place:pl,grade:gr||null})});
if(!out.length)return msg('Choose a place or grade for at least one entry.','m2');const d=await SB.from('results').delete().eq('program_id',id);if(d.error)return msg(d.error.message,'m2');

if(await run(id?SB.from('programs').update(o).eq('id',id):SB.from('programs').insert(o)))coord()}

(async()=>{if(!SB){E('app').innerHTML='<p class="wrap bad">Could not load the page. Check your internet connection and refresh.</p>';return}
const{data}=await SB.auth.getSession();if(data.session)await prof();await load();route()})();
