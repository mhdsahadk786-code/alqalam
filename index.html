<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AL QALAM Literature Festival</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF2EE;--card:#fff;--ink:#12302B;--mute:#4B655E;--line:#C6D4CC;--bad:#A3322B;--sinai:#B4632B;--judi:#1F7A5A;--safa:#2F6DB0;--hero:#0F3B36;--hi:#F1E8D0;--gold:#E2BC62;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0B1B20;--card:#12292F;--ink:#EDE6D2;--mute:#9DB3AC;--line:#24424A;--bad:#F08A80;--sinai:#E08A4F;--judi:#4FBF93;--safa:#6FA8E6}}
:root[data-theme=dark]{--bg:#0B1B20;--card:#12292F;--ink:#EDE6D2;--mute:#9DB3AC;--line:#24424A;--bad:#F08A80;--sinai:#E08A4F;--judi:#4FBF93;--safa:#6FA8E6}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 'Alegreya Sans',system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hero)}
a{color:inherit}:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--hero);color:var(--hi);display:flex;align-items:center;gap:16px;padding:10px 16px}
.brand{font-family:Amiri,serif;font-size:1.25rem;font-weight:700;text-decoration:none;white-space:nowrap;color:var(--gold)}
nav{display:flex;gap:16px;overflow-x:auto;white-space:nowrap}nav a{text-decoration:none;padding:4px 0;border-bottom:2px solid transparent}nav a.on{border-color:var(--gold)}
.hero{background:var(--hero) url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='72' height='72'><g fill='none' stroke='%23E2BC62' stroke-opacity='.16'><rect x='16' y='16' width='40' height='40'/><rect x='16' y='16' width='40' height='40' transform='rotate(45 36 36)'/></g></svg>");color:var(--hi);text-align:center;padding:44px 20px 56px}
.bis{font-family:Amiri,serif;font-size:1.5rem;color:var(--gold)}
.ayah{font-family:Amiri,'Noto Naskh Arabic',serif;font-size:clamp(2.1rem,9vw,3.8rem);line-height:1.9;margin:.2em 0 0}
.pen{width:min(320px,70%);height:14px;display:block;margin:0 auto}
.pen path{stroke-dasharray:1;stroke-dashoffset:1;animation:d 1.8s .3s ease forwards}@keyframes d{to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){.pen path{animation:none;stroke-dashoffset:0}}
.tr{font-style:italic;opacity:.9;margin:.6em auto;max-width:34ch}
h1{font-family:Amiri,serif;font-size:clamp(2.8rem,13vw,5.4rem);letter-spacing:.1em;margin:.1em 0;line-height:1.1}
.moto{font-family:Amiri,serif;font-size:1.5rem;color:var(--gold);margin:0}.org{max-width:34ch;margin:.8em auto}
.wrap{max-width:760px;margin:0 auto;padding:28px 16px 36px}.narrow{max-width:420px}
h2,h3{font-family:Amiri,serif;margin:1.1em 0 .4em}h2{font-size:1.9rem;margin-top:0}
.grid{display:grid;gap:12px}@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0}.grid .card{margin:0}
.mute{color:var(--mute)}.bad{color:var(--bad)}small{font-size:.85em}
.btn{display:inline-block;background:var(--gold);color:#1A1405;font:700 1rem 'Alegreya Sans',sans-serif;border:2px solid var(--gold);border-radius:999px;padding:9px 20px;text-decoration:none;cursor:pointer;margin:4px 2px}
.btn.o{background:transparent;color:inherit;border-color:currentColor}.btn.s{padding:3px 12px;font-size:.9rem;margin-top:8px}
.pill{display:inline-block;border-radius:999px;padding:2px 12px;font-size:.9rem;font-weight:700;border:1px solid currentColor}.ok{color:#8FE0B5}.no{color:#FFB3A8}
.wrap .ok{color:var(--judi)}.wrap .no{color:var(--bad)}.hero .ok{color:#8FE0B5}
.tag{margin-inline-start:8px;font-size:.85rem;border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--mute)}
.row{flex-wrap:wrap;display:flex;gap:12px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line)}.row>span{flex:1}.tm{min-width:54px}
.bar{display:grid;grid-template-columns:104px 1fr 44px;gap:8px;align-items:center;margin:8px 0}.bar i{height:14px;border-radius:7px;display:block}.bar b{text-align:end}
label{display:block;margin:10px 0 2px;font-weight:500}
input,select{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
footer{text-align:center;padding:24px 16px;background:var(--hero);color:var(--hi)}footer b{color:var(--gold)}
.logo{width:96px;height:96px;border-radius:18px;background:#fff;padding:3px;display:block;margin:0 auto 12px}.sm{width:auto;min-width:0}.col3{grid-template-columns:repeat(3,1fr)}

programs(){E('app').innerHTML=`<section class="wrap"><h2>Programs</h2><p class="mute">${when()}</p>${pill()}${srt().map(p=>`<div class="card"><b>${esc(p.name)}</b><div class="mute">${meta(p)}. ${esc(p.cat)}. ${esc(p.day)}, ${esc(p.time)}, ${esc(p.venue)}. Up to ${p.max} per team.</div></div>`).join('')||'<p class="mute">The coordinator has not published programs yet.</p>'}</section>`},
schedule(){const d={};srt().forEach(p=>(d[p.day]=d[p.day]||[]).push(p));E('app').innerHTML=`<section class="wrap"><h2>Schedule</h2><p class="mute">${when()}</p>${Object.keys(d).map(k=>`<h3>${esc(k)}</h3>${d[k].map(p=>`<div class="row"><b class="tm">${esc(p.time)}</b><span>${esc(p.name)}<small class="mute"> ${meta(p)}, ${esc(p.venue)}</small></span></div>`).join('')}`).join('')||'<p class="mute">The schedule will appear once programs are added.</p>'}</section>`},
points(){const p=pts(),mx=Math.max(1,...K.map(k=>p.t[k])),ids=Object.keys(S.results);E('app').innerHTML=`<section class="wrap"><h2>Points</h2><p class="mute">${ids.length} of ${S.programs.length} programs published. Place points: individual ${S.pts.I.join(', ')}; group ${S.pts.G.join(', ')}. Grade points: ${S.gr.map(x=>esc(x.g)+' '+x.p).join(', ')}.</p>
<h3>Team standings</h3>${[...K].sort((a,b)=>p.t[b]-p.t[a]).map(k=>`<div class="bar"><span>${T[k].n}</span><i style="width:${p.t[k]/mx*100}%;background:${T[k].c}"></i><b>${p.t[k]}</b></div>`).join('')}
<h3>Individual leaders</h3>${p.ind.slice(0,10).map((x,i)=>`<div class="row"><b class="tm">${i+1}</b><span>${esc(x.n)}<small class="mute"> ${T[x.tm].n}, ${ZN[x.z]}</small></span><b>${x.v}</b></div>`).join('')||'<p class="mute">Leaders appear here once the coordinator publishes results.</p>'}
<h3>Results by program</h3>${ids.map(id=>{const pr=S.programs.find(x=>x.id==id);return pr?`<div class="card"><b>${esc(pr.name)}</b>${S.results[id].map(r=>`<div>${r.pl?r.pl+'.':'-'} ${esc(r.n)} <small class="mute">${T[r.t].n}${r.g?', grade '+esc(r.g):''}</small></div>`).join('')}</div>`:''}).join('')||'<p class="mute">No results yet.</p>'}</section>`},
login(){E('app').innerHTML=`<section class="wrap narrow"><h2>Log in</h2><p class="mute">For the coordinator and team leaders.</p><label>Email<input id="u" type="email" autocomplete="username" autocapitalize="none"></label><label>Password<input id="pw" type="password" autocomplete="current-password"></label><p id="m" class="bad"></p><button class="btn" onclick="doLogin()">Log in</button></section>`;E('pw').onkeydown=e=>e.key=='Enter'&&doLogin()},
dash(){me.r=='C'?coord():team()}};
async function doLogin(){msg('Signing in…');const{error}=await SB.auth.signInWithPassword({email:g('u'),password:E('pw').value});if(error)return msg('Email or password is not correct.');await prof();if(!me){await SB.auth.signOut();return msg('This account has no role yet. Ask the coordinator.')}await load();go('dash');route()}
async function logout(){await SB.auth.signOut();me=null;S.regs=[];go('home');route()}
function team(){const t=me.t,mine=S.regs.filter(r=>r.t==t);E('app').innerHTML=`<section class="wrap"><h2 style="color:${T[t].c}">${T[t].n} dashboard</h2>${pill()}
${S.open?`<h3>Register a student</h3><p class="mute">Each student can enter up to ${S.lim.O} off-stage and ${S.lim.S} stage individual programs.</p><label>Program<select id="rp">${srt().map(p=>`<option value="${p.id}">${esc(p.name)} (${meta(p)}; ${S.regs.filter(r=>r.t==t&&r.pid==p.id).length}/${p.max} used)</option>`).join('')}</select></label>
<div class="two"><label>Student or group name<input id="rn"></label><label>Class<input id="rc"></label></div><label>Student’s zone<select id="rz"><option value="Y">Young zone</option><option value="M">Mid zone</option><option value="H">High zone</option></select></label><p id="m" class="bad"></p><button class="btn" onclick="addReg()">Register</button>`:'<div class="card bad">Registration is closed. Ask the coordinator to reopen it.</div>'}
<h3>Your registrations (${mine.length})</h3>${mine.map(r=>{const p=S.programs.find(x=>x.id==r.pid);return`<div class="row"><span>${esc(r.n)}<small class="mute"> ${esc(r.c)}, ${ZN[r.z]}. ${p?esc(p.name):''}</small></span>${S.open?`<button class="btn s o" onclick="delReg(${r.id})">Remove</button>`:''}</div>`}).join('')||'<p class="mute">No registrations yet.</p>'}
<h3>Program details</h3>${srt().map(p=>`<div class="row"><span>${esc(p.name)}<small class="mute"> ${meta(p)}, ${esc(p.day)} ${esc(p.time)}, ${esc(p.venue)}</small></span></div>`).join('')}
<p><button class="btn o" onclick="logout()">Log out</button></p></section>`}
async function addReg(){if(!S.open)return;const n=g('rn');if(!n)return msg('Enter the student’s name.');if(await run(SB.from('regs').insert({program_id:+E('rp').value,team:me.t,name:n,student_class:g('rc'),zone:E('rz').value})))team()}
async function delReg(id){if(await run(SB.from('regs').delete().eq('id',id)))team()}
function coord(){const o=(a,v)=>a.map(x=>`<option value="${x[0]}"${x[0]==v?' selected':''}>${x[1]}</option>`).join('');E('app').innerHTML=`<section class="wrap"><h2>Coordinator dashboard</h2>
<div class="card">${pill()} <button class="btn s" onclick="tog()">${S.open?'Stop registration':'Start registration'}</button></div>
<h3>Festival details</h3><div class="two"><label>Dates<input id="fd" value="${esc(S.info.dates)}"></label><label>Venue<input id="fv" value="${esc(S.info.venue)}"></label></div><button class="btn" onclick="saveInfo()">Save details</button>
<h3>Add or edit a program</h3><input id="pe" type="hidden"><label>Program name<input id="pn"></label>
<div class="two"><label>Category<input id="pc" placeholder="Arabic, Arts, Quiz"></label><label>Stage or off stage<select id="ps"><option value="S">Stage</option><option value="O">Off stage</option></select></label>
<label>Individual or group<select id="pt"><option value="I">Individual</option><option value="G">Group</option></select></label><label>Zone<select id="pz">${o(Object.entries(PZ))}</select></label>
<label>Day<input id="pd" value="Day 1"></label><label>Time<input id="ptm" type="time" value="09:00"></label>
<label>Venue<input id="pv"></label><label>Max entries per team<input id="pm" type="number" min="1" value="2"></label></div>
<p id="m" class="bad"></p><button id="pb" class="btn" onclick="addP()">Add program</button>
<h3>Programs and entries</h3>${srt().map(p=>`<div class="card"><b>${esc(p.name)}</b> ${S.results[p.id]?'<span class="pill ok">Results published</span>':''}<div class="mute">${meta(p)}. ${esc(p.day)}, ${esc(p.time)}, ${esc(p.venue)}. Entries: ${K.map(k=>T[k].n+' '+S.regs.filter(r=>r.pid==p.id&&r.t==k).length).join(', ')}</div><button class="btn s" onclick="edP(${p.id})">Edit</button> <button class="btn s o" onclick="delP(${p.id})">Remove</button></div>`).join('')||'<p class="mute">No programs yet. Add the first one above.</p>'}
<h3>Points, grades and limits</h3><p class="mute">Place points for individual programs (1st, 2nd, 3rd)</p><div class="two col3">${[0,1,2].map(i=>`<input id="ip${i+1}" type="number" value="${S.pts.I[i]}">`).join('')}</div>
<p class="mute">Place points for group programs</p><div class="two col3">${[0,1,2].map(i=>`<input id="gp${i+1}" type="number" value="${S.pts.G[i]}">`).join('')}</div>
<p class="mute">Grades: name and points (leave the name empty to remove a grade)</p><div class="two">${[0,1,2,3].map(i=>`<input id="gn${i}" placeholder="Grade name" value="${esc((S.gr[i]||{}).g||'')}"><input id="gv${i}" type="number" placeholder="Points" value="${(S.gr[i]||{}).p??''}">`).join('')}</div>
<div class="two"><label>Off-stage individual limit per student<input id="lo" type="number" min="1" value="${S.lim.O}"></label><label>Stage individual limit per student<input id="ls" type="number" min="1" value="${S.lim.S}"></label></div>
<button class="btn" onclick="saveRules()">Save points and limits</button>
<h3>Publish results</h3><label>Program<select id="rs" onchange="resUI()">${srt().map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label><div id="slots"></div>
<p id="m2" class="bad"></p><button class="btn" onclick="pub()">Publish results</button> <button class="btn o" onclick="unpub()">Unpublish</button>
<p><button class="btn o" onclick="logout()">Log out</button> </p></section>`;resUI()}
function saveInfo(){setS({info:{dates:g('fd'),venue:g('fv')}})}
function saveRules(){const n=i=>+E(i).value||0;setS({pts:{I:[1,2,3].map(i=>n('ip'+i)),G:[1,2,3].map(i=>n('gp'+i))},gr:[0,1,2,3].map(i=>({g:g('gn'+i),p:n('gv'+i)})).filter(x=>x.g),lim:{O:Math.max(1,n('lo')),S:Math.max(1,n('ls'))}})}
function edP(id){const p=S.programs.find(x=>x.id==id);[['pn','name'],['pc','cat'],['pt','type'],['ps','st'],['pz','zone'],['pd','day'],['ptm','time'],['pv','venue'],['pm','max']].forEach(a=>E(a[0]).value=p[a[1]]);E('pe').value=id;E('pb').textContent='Save changes';E('pn').scrollIntoView({block:'center'});E('pn').focus()}
function resUI(){const s=E('rs');if(!s)return;const id=+s.value,rs=S.regs.filter(r=>r.pid==id),cur=S.results[id]||[];
E('slots').innerHTML=rs.length?rs.map(r=>{const c=cur.find(x=>x.n==r.n&&x.t==r.t)||{};return`<div class="row"><span>${esc(r.n)}<small class="mute"> ${T[r.t].n}, ${ZN[r.z]}</small></span><select class="sm" id="pl${r.id}" aria-label="Place"><option value="0">No place</option>${[1,2,3].map(i=>`<option value="${i}"${c.pl==i?' selected':''}>Place ${i}</option>`).join('')}</select><select class="sm" id="gr${r.id}" aria-label="Grade"><option value="">No grade</option>${S.gr.map(x=>`<option value="${esc(x.g)}"${c.g==x.g?' selected':''}>Grade ${esc(x.g)}</option>`).join('')}</select></div>`}).join(''):'<p class="mute">No team has registered for this program yet.</p>'}
async function pub(){const id=+E('rs').value,out=[];S.regs.filter(r=>r.pid==id).forEach(r=>{const pl=+E('pl'+r.id).value,gr=E('gr'+r.id).value;if(pl||gr)out.push({program_id:id,team:r.t,name:r.n,zone:r.z,place:pl,grade:gr||null})});
if(!out.length)return msg('Choose a place or grade for at least one entry.','m2');const d=await SB.from('results').delete().eq('program_id',id);if(d.error)return msg(d.error.message,'m2');
if(await run(SB.from('results').insert(out),'m2')){coord();E('rs').value=id;resUI()}}
async function unpub(){const id=+E('rs').value;if(id&&await run(SB.from('results').delete().eq('program_id',id)))coord()}
function tog(){setS({open:!S.open})}
async function addP(){if(!g('pn'))return msg('Enter a program name.');const o={name:g('pn'),category:g('pc')||'General',type:g('pt'),stage:g('ps'),zone:g('pz'),day:g('pd')||'Day 1',at_time:g('ptm')||'09:00',venue:g('pv')||'To be announced',max_per_team:+g('pm')||1},id=+g('pe');
if(await run(id?SB.from('programs').update(o).eq('id',id):SB.from('programs').insert(o)))coord()}
async function delP(id){if(await run(SB.from('programs').delete().eq('id',id)))coord()}
function route(){let r=location.hash.slice(1)||'home';if(r=='dash'&&!me)r='login';(V[r]||V.home)();
E('nav').innerHTML=[['home','Home'],['programs','Programs'],['schedule','Schedule'],['points','Points'],[me?'dash':'login',me?'Dashboard':'Login']].map(a=>`<a href="#${a[0]}"${a[0]==r?' class="on"':''}>${a[1]}</a>`).join('');scrollTo(0,0);if(ERR)E('app').insertAdjacentHTML('afterbegin','<div class="wrap bad">Could not load data: '+esc(ERR)+'</div>')}
addEventListener('hashchange',()=>load().then(route));
(async()=>{if(!SB){E('app').innerHTML='<p class="wrap bad">Could not load the page. Check your internet connection and refresh.</p>';return}
const{data}=await SB.auth.getSession();if(data.session)await prof();await load();route()})();
</script></body></html>
